<!-- Base Chart Component Template -->
<div #chartWrapper class="chart-wrapper">
  <!-- Error boundary fallback -->
  <ng-container *ngIf="hasError">
    <div class="chart-error">
      <div class="error-content">
        <i class="pi pi-exclamation-triangle"></i>
        <p class="error-title">Chart failed to render</p>
        <p class="error-message">{{ errorMessage }}</p>
        <button
          pButton
          type="button"
          label="Retry"
          icon="pi pi-refresh"
          class="p-button-outlined p-button-sm"
          (click)="retryRender()">
        </button>
      </div>
    </div>
  </ng-container>

  <!-- Plotly chart via wrapper (hidden when error or no data) -->
  <plotly-plot
    *ngIf="plotData.length > 0 && !hasError"
    [data]="plotData"
    [layout]="plotLayout"
    [config]="plotConfig"
    [revision]="plotRevision"
    [useResizeHandler]="true"
    [style]="{width: '100%', height: '100%'}"
    (plotlyClick)="onPlotlyClick($event)"
    (selected)="onPlotlySelected($event)"
    (error)="onPlotlyError($any($event))"
    class="chart-container">
  </plotly-plot>

  <!-- No data message -->
  <ng-container *ngIf="!statistics && !hasError">
    <div class="no-data-message">
      <p>No data available</p>
    </div>
  </ng-container>
</div>
